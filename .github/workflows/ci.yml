name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COVERAGE_MIN: "80.0"
  GOTOOLCHAIN: local

jobs:
  go:
    # The one check the main-branch ruleset requires, so every gating job
    # must feed it: a job outside `needs` can fail without blocking a merge.
    # rule-surface-append-only runs only on a pull request and is skipped on
    # a push to main, where there is no base to compare against.
    if: always()
    needs: [go-amd64, go-arm64, workflow-and-shell-lint, rule-surface-append-only]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job
        env:
          AMD64_RESULT: ${{ needs.go-amd64.result }}
          ARM64_RESULT: ${{ needs.go-arm64.result }}
          LINT_RESULT: ${{ needs.workflow-and-shell-lint.result }}
          RULE_SURFACE_RESULT: ${{ needs.rule-surface-append-only.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          test "$AMD64_RESULT" = success
          test "$ARM64_RESULT" = success
          test "$LINT_RESULT" = success
          if test "$EVENT_NAME" = pull_request; then
            test "$RULE_SURFACE_RESULT" = success
          else
            test "$RULE_SURFACE_RESULT" = skipped
          fi

  rule-surface-append-only:
    # A pull request may append a rule surface for a new RulesVersion; it may
    # not rewrite the one a released version already records. The Go test
    # beside RuleSurfaceFingerprints compares today's source against today's
    # row, which no checked-in value can do for its own history — so this
    # compares against main instead. Runs only on a pull request, where a
    # base to compare against exists.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The base branch must be fetchable; a shallow clone has no main to
          # compare against.
          fetch-depth: 0
          # This job runs a script from the pull request's own branch, so the
          # branch's author controls the code that runs here. Checkout would
          # otherwise leave GITHUB_TOKEN in .git/config for that code to read.
          # The repository is public, so the fetch below needs no credentials.
          persist-credentials: false

      - name: Refuse a rewritten rule surface
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"

          # Run the BASE branch's copy of the validator, never the branch's
          # own. The working tree here belongs to the pull request, so a
          # branch that edits a released row could also edit the script that
          # refuses it and the guard would approve its own bypass. Only the
          # file being judged comes from the pull request.
          if ! git cat-file -e "FETCH_HEAD:scripts/rule-surface-append-only.sh" 2>/dev/null; then
            # The base has no validator yet, so it also records no rule
            # surface rows — there is nothing for a branch to rewrite, and
            # nothing to run. Safe by the same fact, not by assumption.
            if git cat-file -e "FETCH_HEAD:internal/strategy/rules_version.go" 2>/dev/null &&
               git show "FETCH_HEAD:internal/strategy/rules_version.go" | grep -qE '^[[:space:]]*"[0-9][^"]*":[[:space:]]*"[0-9a-f]{64}"'; then
              echo "The base records rule surface rows but carries no validator to check them against." >&2
              exit 1
            fi
            echo "rule-surface-append-only: the base records no rule surface yet; nothing to protect."
            exit 0
          fi

          git show "FETCH_HEAD:scripts/rule-surface-append-only.sh" > /tmp/rule-surface-append-only.sh
          chmod +x /tmp/rule-surface-append-only.sh
          /tmp/rule-surface-append-only.sh FETCH_HEAD

  workflow-and-shell-lint:
    # actionlint and shellcheck are pinned release binaries verified by
    # SHA-256, not `tool` directives: actionlint's YAML dependency cannot
    # share this module's graph with golangci-lint's (see
    # docs/dependency-policy.md). actionlint runs shellcheck over every
    # workflow `run:` block when shellcheck is on PATH, so it is installed
    # first.
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned linters
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" bin/
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          mv actionlint bin/
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Lint workflows
        run: actionlint

  go-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The branch author controls the test code this job executes, so
          # checkout must not leave GITHUB_TOKEN in .git/config for it to read.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test -race ./...

      - name: Run the LEAN adapter suite
        run: make adapter-test

  go-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The branch author controls the build tools this job executes, so
          # checkout must not leave GITHUB_TOKEN in .git/config for it to read.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run quality gates
        run: make check

      - name: Add coverage to job summary
        if: always()
        run: |
          if test -f coverage.txt; then
            {
              echo "### Go coverage"
              echo '```text'
              cat coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: ignore
          retention-days: 14
