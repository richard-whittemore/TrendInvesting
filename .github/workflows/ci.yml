name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COVERAGE_MIN: "80.0"
  GOTOOLCHAIN: local

jobs:
  go:
    if: always()
    needs: [go-amd64, go-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Require both architectures
        env:
          AMD64_RESULT: ${{ needs.go-amd64.result }}
          ARM64_RESULT: ${{ needs.go-arm64.result }}
        run: test "$AMD64_RESULT" = success && test "$ARM64_RESULT" = success

  rule-surface-append-only:
    # A pull request may append a rule surface for a new RulesVersion; it may
    # not rewrite the one a released version already records. The Go test
    # beside RuleSurfaceFingerprints compares today's source against today's
    # row, which no checked-in value can do for its own history — so this
    # compares against main instead. Runs only on a pull request, where a
    # base to compare against exists.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The base branch must be fetchable; a shallow clone has no main to
          # compare against.
          fetch-depth: 0
          # This job runs a script from the pull request's own branch, so the
          # branch's author controls the code that runs here. Checkout would
          # otherwise leave GITHUB_TOKEN in .git/config for that code to read.
          # The repository is public, so the fetch below needs no credentials.
          persist-credentials: false

      - name: Refuse a rewritten rule surface
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          ./scripts/rule-surface-append-only.sh FETCH_HEAD

  go-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test -race ./...

  go-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run quality gates
        run: make check

      - name: Add coverage to job summary
        if: always()
        run: |
          if test -f coverage.txt; then
            {
              echo "### Go coverage"
              echo '```text'
              cat coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: ignore
          retention-days: 14
