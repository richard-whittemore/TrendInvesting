# The Traditional IRA's Flex reader fires 15 minutes after Boost's (05:30,
# 06:30, 07:30; ti-flex@.timer): every account's reader uses the one Flex
# token, only one reading holds it at a time, and IBKR paces requests
# (docs/live-trading/lessons-2026-10.md L3; docs/manual/reconciliation.md,
# "The IRA readers fire later than Boost's"). Each firing is still before the
# IRA's data job (ti-data@.timer: 06:15, 07:15, 08:15) and the adapter's 09:00
# wait for the executions proof. The empty OnCalendar= clears the template's
# times first. Installed by provision.sh services.
[Timer]
OnCalendar=
OnCalendar=Mon..Fri 05:45 America/New_York
OnCalendar=Mon..Fri 06:45 America/New_York
OnCalendar=Mon..Fri 07:45 America/New_York
